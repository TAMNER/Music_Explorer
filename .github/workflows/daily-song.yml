name: Fetch daily song

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      force_date:
        description: "UTC date to use (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-song
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch today's song
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          FORCE_DATE: ${{ inputs.force_date }}
        run: node scripts/fetch-daily-song.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/songs.json data/sequence.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git pull --rebase origin main
          git commit -m "Add daily song: $(date -u +%Y-%m-%d)"
          git push origin main
